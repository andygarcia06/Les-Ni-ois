<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Niçois - Newsletter</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
</head>
<body class="body-contact">


  <header>
    <nav class="other-nav">
      <ul>
        <li><a href="./newsletter.html" class="active">Newsletter</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <button id="backButton" class="back-button">
        <i class="fas fa-arrow-left"></i>
      </button>
    <div class="contact-container">
      <!-- Image d'en-tête -->
      <img src="./assets/img/contact/newsletter-2.jpg" alt="Image du fondateur Luc Sananes présentant un repas Les Niçois" class="contact-image" id="newsletterImage">
      
      <!-- Section Texte et Formulaire Newsletter -->
      <section class="contact-form">
        <h2>ON TE SENT TENDU.<br>BESOIN DE VACANCES ?</h2>
        <p>Le sud, le soleil, les cigales, l’apéro sur la plage, les parties de pétanque entre copains...</p>
        <h2>ARRÊTE DE RÊVER À L'ÉTÉ PROCHAIN.<br>REJOINS NOTRE NEWSLETTER !</h2>
        <p>C’est plus rapide que le train.</p>
        <form id="newsletterForm">
          <input type="email" id="newsletter-email" name="email" placeholder="Adresse e-mail" required>
          <button type="submit">Je m’abonne</button>
        </form>
      </section>
    </div>
  </main>


  
  <script src="./assets/js/manifesto.js"></script>
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="assets/js/features.js"></script>
  <script src="assets/js/transition.js"></script>
  <script src="assets/js/popup.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="./assets/js/animation.js"></script>
</body>
</html>
