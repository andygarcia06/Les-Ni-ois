<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Les Niçois - Newsletter</title>
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Favicon en format .ico -->
<link rel="icon" href="./assets/img/favicon/favicon_generated.ico" type="image/x-icon">

<!-- Favicon en format .png pour différentes tailles -->
<link rel="icon" type="image/png" sizes="16x16" href="./assets/img/favicon/favicon_16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon/favicon_32x32.png">

<!-- Apple Touch Icon pour iOS -->
<link rel="apple-touch-icon" sizes="180x180" href="./assets/img/favicon/favicon_256x256.png">

<body class="newsletter-body">
    <header>
        <nav class="other-nav">
            <ul>
                <li class="nav-logo"><a href="./index"><img src="./assets/img/logo-les-nicois-white-transparent.png" alt="logo les niçois"></a></li>
                <li><a href="/newsletter" >Newsletter</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="newsletter-container">
            <!-- Image d'en-tête -->
            <img src="./assets/img/contact/newsletter-2.jpg" alt="Image du fondateur Luc Sananes en train de présenter un repas préparer par Les Niçois sur une table extérieur, ambiance conviviale" class="newsletter-image" id="newsletterImage">

            <section class="newsletter-text-section">
                <div class="newsletter-text-container">
                <h2>ON TE SENT TENDU.<br> BESOIN DE VACANCES ?</h2>
                <p>Le sud, le soleil, les cigales, l’apéro sur la plage, les parties de pétanque entre copains...</p>
                <h2>ARRÊTE DE RÊVER À L'ÉTÉ PROCHAIN.<br> REJOINS NOTRE NEWSLETTER !</h2>
                <p>C’est plus rapide que le train.</p>
                </div>

                <!-- Newsletter Form -->
                <form class="newsletter-form">
                    <input type="email" id="newsletter-email" name="email" placeholder="Adresse e-mail" required>
                    <button type="submit">Je m’abonne</button>
                </form>
            </section>     
        </div>
    </main>


    <script src="./assets/js/manifesto.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="assets/js/features.js"></script>
    <script src="assets/js/transition.js"></script>
    <script src="assets/js/popup.js"></script>
    <script src="assets/js/player.js"></script>
    <script src="./assets/js/animation.js"></script>
</body>
</html>
